[project]
name = "curlify3"
version = "0.1.0"
description = "yet another library to convert request object to curl command"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "A.Shpak", email = "shpaker@gmail.com"},
]

[project.urls]
Repository = "https://github.com/shpaker/curlify3"

[dependency-groups]
dev = [
    "black>=24.8",
    "isort>=5.13",
    "requests>=2.32",
    "httpx>=0.28",
    "httpx2[http2]>=2.0",
    "fastapi>=0.115",
    "aiohttp>=3.10",
    "pytest>=7.4",
    "pytest-aiohttp>=1.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curlify3"]

[tool.hatch.build.targets.sdist]
include = ["curlify3", "README.md", "pyproject.toml"]

[tool.isort]
line_length = 120
include_trailing_comma = true
lines_between_types = 1

[tool.black]
line-length = 120
skip-string-normalization = true
