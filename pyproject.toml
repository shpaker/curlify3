[project]
name = "curlify3"
version = "0.1.0"
description = "yet another library to convert request object to curl command"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "A.Shpak", email = "shpaker@gmail.com"},
]
# the pypi badge in the README reads the python versions off these; no License ::
# classifier, it is superseded by the SPDX expression above (PEP 639)
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/shpaker/curlify3"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "ty>=0.0.72",
    "requests>=2.32",
    "niquests>=3",
    "httpx>=0.28",
    "httpx2[http2]>=2.0",
    "fastapi>=0.115",
    "aiohttp>=3.10",
    "django>=4.2",
    "flask>=3.0",
    "tornado>=6.2",
    "pytest>=7.4",
    "pytest-aiohttp>=1.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curlify3"]

[tool.hatch.build.targets.sdist]
include = ["curlify3", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 120
# target-version is inferred from project.requires-python

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "ANN", "RUF"]
ignore = [
    # the try/except UnicodeDecodeError/pass + return shape reads better than
    # contextlib.suppress and is repeated across all five request adapters
    "SIM105",
    # dict(...) marks the request kwargs that are splatted into httpx.Request
    "C408",
]

[tool.ruff.lint.per-file-ignores]
# the expected curl commands are compared verbatim, so they cannot be wrapped;
# the file handles are what httpx takes the multipart filename from, so they
# cannot become `with` blocks without changing the expected output
"test_curlify3.py" = ["E501", "SIM115"]

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ruff.format]
# black's skip-string-normalization
quote-style = "preserve"
# the README snippets are illustrative, keep them compact
exclude = ["*.md"]
# every parameter of a function goes on its own line, so every parameter list
# ends with a trailing comma. Nothing in ruff can require that of a signature
# written on one line, but the magic trailing comma keeps the ones that are
# already written that way from being collapsed back — leave it enabled.
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.10"

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"
