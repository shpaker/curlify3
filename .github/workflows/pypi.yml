---
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Extract version
        id: extract_name_and_version
        shell: bash
        run: echo "ver=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
      # anchored on the version lines: 0.1.0 is also a plausible dependency
      # bound, and dependabot writes those into pyproject.toml
      - name: Set version
        env:
          VER: ${{ steps.extract_name_and_version.outputs.ver }}
        run: |
          set -euo pipefail
          sed -i 's/^version = "0.1.0"$/version = "'"$VER"'"/' pyproject.toml
          sed -i 's/^__version__ = "0.1.0"$/__version__ = "'"$VER"'"/' curlify3/__init__.py
          # assert the new value, not just the shape: a sed that matched nothing
          # would otherwise leave the placeholder and publish it silently
          grep -qxF 'version = "'"$VER"'"' pyproject.toml
          grep -qxF '__version__ = "'"$VER"'"' curlify3/__init__.py
          echo "version set to $VER"
      - run: uv build
      - run: uv publish --token "${{ secrets.PYPI_PASS }}"
